<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Fyr directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#eceef1;--card:#fff;--ink:#111820;--muted:#56616d;--line:#dde1e6}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f13;--card:#161d24;--ink:#e8ecf0;--muted:#9aa6b2;--line:#26303a}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif}
body{padding:24px}
h1{margin:0;font-size:22px;line-height:28px;font-weight:600}
.lede{margin:6px 0 20px;color:var(--muted);font-size:14px;line-height:20px;max-width:900px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.view{position:relative;width:100%;aspect-ratio:1280/800;overflow:hidden;border-bottom:1px solid var(--line)}
/* each iframe shows the light frame of its file; the frame sits 60px from the left and about 134px from the top */
.view iframe{position:absolute;left:0;top:0;width:1400px;height:920px;border:0;transform-origin:0 0;pointer-events:none}
figcaption{padding:12px 16px 14px;font-size:13px;line-height:19px;color:var(--muted);min-width:0}
figcaption b{display:block;color:var(--ink);font-size:15px;line-height:20px;margin-bottom:2px}
figcaption a{color:inherit;font-family:"IBM Plex Mono",monospace;font-size:12px}
</style></head><body>
<h1>Fyr · five visual directions</h1>
<p class="lede">Same content in each: inbox, one thread, a docked question card. Each file shows light, dark and two stress-test frames with extreme text. Open a file for the full page; README.md compares them.</p>
<div class="grid">
<figure><div class="view"><iframe src="01-ledger.html" title="01 Ledger" loading="lazy"></iframe></div><figcaption><b>01 Ledger</b>A ruled table with fixed columns for project, PR and age, in IBM Plex Sans Condensed.<br>Densest view; every row lines up, so you scan one column at a time. <a href="01-ledger.html">open</a></figcaption></figure>
<figure><div class="view"><iframe src="02-console.html" title="02 Console" loading="lazy"></iframe></div><figcaption><b>02 Console</b>JetBrains Mono everywhere except Claude's prose and the question, which are Inter.<br>A modeline at the bottom always shows the mode and the keys that work now. <a href="02-console.html">open</a></figcaption></figure>
<figure><div class="view"><iframe src="03-reader.html" title="03 Reader" loading="lazy"></iframe></div><figcaption><b>03 Reader</b>Inter for the interface, Newsreader serif for Claude's text and the question.<br>The question is the largest text on screen and is quoted in the inbox card. <a href="03-reader.html">open</a></figcaption></figure>
<figure><div class="view"><iframe src="04-rail.html" title="04 Rail" loading="lazy"></iframe></div><figcaption><b>04 Rail</b>Geist and Geist Mono, three columns with a count rail on the far left.<br>Section counts are always visible; options sit in a 2 × 2 grid of keyed tiles. <a href="04-rail.html">open</a></figcaption></figure>
<figure><div class="view"><iframe src="05-spine.html" title="05 Spine" loading="lazy"></iframe></div><figcaption><b>05 Spine</b>Atkinson Hyperlegible Next and Mono, time first.<br>A time gutter runs down the inbox and becomes the thread's timeline, which ends in the question. <a href="05-spine.html">open</a></figcaption></figure>
</div>
<style>
/* scale each 1400px page so its 1280px light frame fills the card: the frame starts at x=60, y=134 */
.view iframe{transform:scale(var(--s)) translate(-60px,-134px)}
</style>
<script>
// Fits the iframe scale to the card width. Without script the frames still show, unscaled and cropped.
function fit(){document.querySelectorAll('.view').forEach(function(v){v.style.setProperty('--s',v.clientWidth/1280)})}
addEventListener('resize',fit);fit();
</script>
</body></html>
