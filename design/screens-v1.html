<!doctype html>
<!-- Fyr v1 screens: the round-5 UX changes applied (states done/seen/blocked, working expanded,
     away strip, one-question-at-a-time card docked above the composer, phone push answer and capture,
     bulk settle with undo). Self-contained; open in a browser. -->
<html><head><meta charset="utf-8"><title>Fyr v1 screens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[data-theme="light"]{--s:#f6f7f8;--r:#fff;--k:#edeff2;--sel:#e6ecf3;--l:#dde1e6;--ls:#b4bcc6;--i:#111820;--im:#56616d;--if:#7d8894;--n:#14212d;--on:#f6f7f8;--b:#e8960f;--bm:#b86e00;--bi:#8f5300;--ob:#1a1204;--bw:#fdf1dc;--sg:#b42318;--h:#2f6fb0;--hw:#e7f0fa;--c:#2e7d5b}
[data-theme="dark"]{--s:#0f1419;--r:#161d24;--k:#0b0f13;--sel:#1c2733;--l:#26303a;--ls:#3d4957;--i:#e8ecf0;--im:#9aa6b2;--if:#6f7b87;--n:#24323f;--on:#f6f7f8;--b:#f5a524;--bm:#f5a524;--bi:#f5b54a;--ob:#1a1204;--bw:#2a2112;--sg:#ff8a7d;--h:#6fa8e8;--hw:#15253a;--c:#5cc49a}
html,body{margin:0;background:#888}
body{padding:16px}
*{box-sizing:border-box}
.st{display:flex;flex-direction:column;gap:18px;font-family:"IBM Plex Sans",system-ui,sans-serif}
.cap{font:600 12px/16px "IBM Plex Sans",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;margin-bottom:-10px}
.fr{border-radius:12px;overflow:hidden;border:1px solid rgba(127,127,127,.25);width:max-content;max-width:100%}
.dk{width:1200px;display:grid;grid-template-columns:420px minmax(0,1fr);background:var(--s);color:var(--i);font-size:14px}
.ib{background:var(--r);border-right:1px solid var(--l);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--l)}
.br{font:600 16px/20px inherit;letter-spacing:-.01em}
.hc{font:400 12px/16px "IBM Plex Mono",monospace;color:var(--im);display:inline-flex;align-items:center;gap:5px}
.hc i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.kb{font:500 12px/16px "IBM Plex Mono",monospace;padding:0 4px;min-width:16px;text-align:center;border:1px solid var(--ls);border-bottom-width:2px;border-radius:3px;color:var(--im);background:var(--r);display:inline-block}
.away{display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--hw);border-bottom:1px solid var(--l);font:400 12px/16px inherit;color:var(--i)}
.away b{font-weight:600}.away .x{margin-left:auto;color:var(--im)}
.sec{display:flex;align-items:center;gap:8px;height:30px;padding:0 16px;background:var(--k);border-block:1px solid var(--l);font:600 12px/16px inherit;letter-spacing:.04em;text-transform:uppercase;color:var(--im)}
.sec .n{font:500 12px/16px "IBM Plex Mono",monospace;letter-spacing:0}
.sec.att .n{background:var(--b);color:var(--ob);border-radius:3px;padding:0 5px}
.sec .h{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;color:var(--im)}
.rw{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;padding:10px 16px;border-bottom:1px solid var(--l);align-items:start}
.rw.sel{background:var(--sel)}
.rw .t{font:500 14px/20px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw.dn .t{font-weight:600}
.rw .m{grid-column:2/4;font:400 12px/16px inherit;color:var(--im);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .m b{font-weight:500}
.side{display:flex;gap:8px;align-items:center;font:400 12px/16px inherit;color:var(--im)}
.one{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:10px;align-items:center;height:32px;padding:0 16px;border-bottom:1px solid var(--l);font:400 12px/16px inherit;color:var(--im)}
.one .t{font:500 14px/20px inherit;color:var(--im);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one .t span{font-weight:400;font-size:12px;margin-left:8px}
.one.warn .t{color:var(--i)}
.ck{width:14px;height:14px;border:1.5px solid var(--ls);border-radius:3px;display:inline-block}
.ck.on{background:var(--n);border-color:var(--n)}
.pr{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border:1px solid var(--l);border-radius:3px;font:500 12px/16px "IBM Plex Mono",monospace;color:var(--im);white-space:nowrap}
.pr.f{border-color:var(--sg);color:var(--sg)}.pr.ok{color:var(--c)}.pr.mg{background:var(--k)}
.sa{color:var(--bm)}.sf{color:var(--sg)}.sb{color:var(--h)}.sd{color:var(--i)}.sm{color:var(--im)}.sc{color:var(--c)}
.th{display:flex;flex-direction:column;min-width:0}
.thh{padding:14px 24px 0;background:var(--r);border-bottom:1px solid var(--l)}
.tr{display:flex;align-items:center;gap:10px}
.tt{font:600 20px/28px inherit;letter-spacing:-.01em}
.bd{display:inline-flex;align-items:center;gap:4px;font:500 12px/16px inherit}
.tabs{display:flex;gap:20px;margin-top:10px}
.tabs span{padding:8px 0;font:500 14px/20px inherit;color:var(--im);border-bottom:2px solid transparent}
.tabs span.on{color:var(--i);border-color:var(--i)}
.tabs em{font-style:normal;font:400 12px/16px "IBM Plex Mono",monospace;margin-left:6px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--ls);background:var(--r);color:var(--i);font:500 14px/20px inherit}
.btn.p{background:var(--n);border-color:var(--n);color:var(--on)}.btn.p .kb{background:transparent;color:var(--on);border-color:rgba(246,247,248,.35)}
.btn.g{border-color:transparent;background:transparent;color:var(--im)}
.btn[disabled]{opacity:.5}
.ml{margin-left:auto;display:flex;gap:8px;align-items:center}
.bdy{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.msg{font:400 16px/26px inherit;max-width:700px}
.who{font:600 12px/16px inherit;color:var(--im);margin-bottom:2px}
.run{max-width:700px;border:1px solid var(--l);border-radius:10px;background:var(--r)}
.rh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--l);font:400 12px/16px inherit;color:var(--im)}
.tl{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;padding:7px 12px;border-bottom:1px solid var(--l);font:400 12px/18px "IBM Plex Mono",monospace}
.tl .x{color:var(--if)}.tl .s{font-family:"IBM Plex Sans",sans-serif;color:var(--im)}
.film{display:flex;gap:8px;padding:10px 12px}
.shot{width:120px;height:76px;border-radius:6px;border:1px solid var(--l);background:linear-gradient(180deg,var(--k) 0 22%,var(--r) 22%);position:relative}
.shot:after{content:"";position:absolute;left:10px;right:40px;top:30px;height:8px;border-radius:2px;background:var(--l);box-shadow:0 16px 0 var(--l),18px 32px 0 var(--l)}
.dec{margin:0 24px;border:1px solid var(--l);border-radius:10px;background:var(--r);overflow:hidden;max-width:760px}
.dh{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bw);border-bottom:1px solid var(--l);font:400 12px/16px inherit;color:var(--im)}
.dh b{color:var(--bi);font-weight:600}
.db{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--h)}
.q{font:500 16px/24px inherit}
.op{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:8px 12px;border:1px solid var(--l);border-radius:6px}
.op.on{border-color:var(--h);background:var(--hw)}
.op .a{font:500 14px/20px inherit}.op .d{font:400 12px/16px inherit;color:var(--im)}
.q2{padding:10px 16px;border-top:1px solid var(--l);font:400 14px/20px inherit;color:var(--im);display:flex;gap:10px;align-items:center}
.cmp{margin:12px 24px 18px;border:1px solid var(--ls);border-radius:10px;background:var(--r)}
.cmp .in{padding:12px 14px;font:400 16px/24px inherit;color:var(--if)}
.cmp .cb{display:flex;gap:10px;align-items:center;padding:6px 8px 6px 14px;border-top:1px solid var(--l);font:400 12px/16px inherit;color:var(--im)}
.ph{width:360px;height:740px;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;background:var(--s);color:var(--i);border:1px solid rgba(127,127,127,.3);font-size:14px}
.pt{display:flex;align-items:center;gap:8px;padding:16px 16px 10px;background:var(--r);border-bottom:1px solid var(--l);font:600 16px/20px inherit}
.pbody{padding:14px 14px 0;display:flex;flex-direction:column;gap:10px;flex:1}
.tile{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;min-height:52px;padding:8px 12px;border:1px solid var(--l);border-radius:8px;background:var(--r)}
.tile.on{border-color:var(--h);background:var(--hw)}
.stick{padding:12px 14px 22px;border-top:1px solid var(--l);background:var(--r);display:flex;gap:10px}
.big{flex:1;height:48px;justify-content:center;font-size:16px}
.pnav{display:flex;justify-content:space-around;align-items:center;padding:10px 0 22px;border-top:1px solid var(--l);background:var(--r);font:500 12px/16px inherit;color:var(--im)}
.pnav .new{width:48px;height:48px;border-radius:24px;background:var(--n);color:var(--on);display:grid;place-items:center;font:400 26px/1 inherit}
.chip{display:inline-flex;gap:6px;align-items:center;height:36px;padding:0 12px;border:1px solid var(--ls);border-radius:18px;font:500 14px/20px inherit;background:var(--r)}
.paste{height:150px;border:1.5px dashed var(--ls);border-radius:10px;display:grid;place-items:center;color:var(--im);font:500 14px/20px inherit;background:var(--r)}
.ta{min-height:110px;border:1px solid var(--ls);border-radius:10px;padding:12px;font:400 16px/24px inherit;background:var(--r);color:var(--i)}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;padding:8px 8px 8px 16px;border-radius:10px;background:var(--n);color:var(--on);font:500 14px/20px inherit;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.toast .btn{height:28px;background:transparent;color:var(--on);border-color:rgba(246,247,248,.3)}
.toast .btn .kb{background:transparent;color:var(--on);border-color:rgba(246,247,248,.35)}
.phones{display:flex;gap:14px;flex-wrap:wrap}
</style></head><body>
<div class="st" id="st"></div>
<script>
var I={
a:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M6.2 6.1a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4" fill="none" stroke="var(--r)" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="var(--r)"/></svg>',
f:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 .9 15.1 8 8 15.1.9 8Z" fill="currentColor"/><path d="M8 4.6v4.2" stroke="var(--r)" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".95" fill="var(--r)"/></svg>',
b:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="5" y="7" width="6" height="2" rx="1" fill="currentColor"/></svg>',
d:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4" fill="currentColor"/></svg>',
w:'<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="1.7"/><path d="M8 2.5a5.5 5.5 0 0 1 5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
h:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2h8M4 14h8M5 2.5c0 3 6 3 6 5.5s-6 2.5-6 5.5M11 2.5c0 3-6 3-6 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
s:'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
z:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M10.5 2.6a5.6 5.6 0 1 0 3 8.9A4.6 4.6 0 0 1 10.5 2.6Z" fill="currentColor"/></svg>',
c:'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.2 8.4 6.5 11.6 12.8 4.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
function hc(n){return '<span class="hc"><i></i>'+n+'</span>'}
function row(ic,cl,t,m,side,x){return '<div class="rw '+(x||'')+'"><span class="'+cl+'">'+I[ic]+'</span><div class="t">'+t+'</div><div class="side">'+side+'</div><div class="m">'+m+'</div></div>'}
function one(ic,cl,t,sub,right,x){return '<div class="one '+(x||'')+'"><span class="'+cl+'">'+I[ic]+'</span><div class="t">'+t+'<span>'+sub+'</span></div><span>'+right+'</span></div>'}
function sec(t,n,a,h){return '<div class="sec'+(a?' att':'')+'">'+t+' <span class="n">'+n+'</span>'+(h?'<span class="h">'+h+'</span>':'')+'</div>'}
var inbox='<div class="ib"><div class="bar"><span class="br">Fyr</span>'+hc('desk')+'<span class="ml"><span class="kb">⌘K</span></span></div>'+
'<div class="away"><span>Since <b>14:02</b>: 3 done · 2 PRs merged · 1 failed</span><span class="x">Dismiss</span></div>'+
sec('Needs you',4,1)+
row('a','sa','Fix map lasso on mobile','<b class="sa">2 questions</b> · Which gesture closes the filter sheet?','<span class="pr">#4182 open</span><span>2 min</span>','sel')+
row('f','sf','Speed up e2e suite','<b class="sf">API error</b> · stopped after 14 min · Retry ⏎','<span>9 min</span>')+
row('b','sb','Listing cards v2','<b class="sb">CI failed</b> · lint: 2 errors in CardGrid.tsx','<span class="pr f">#4177 CI ✕</span><span>21 min</span>')+
row('d','sd','Triage sprint issues','<b>Done</b> · Filed 6 issues, closed 2 duplicates','<span>1 h</span>','dn')+
sec('Working',4,0,'1 waiting for a build slot')+
one('w','sm','Babysit PR #4170','rebase on main · 3 min','<span class="kb">⌘1</span>')+
one('w','sm','Map perf','vitest 38 s · 12 min · 2 subagents','<span class="kb">⌘2</span>')+
one('h','sm','Deploy check','waiting on monitor: deploy · 9 min','<span class="kb">⌘3</span>')+
one('b','sb','Search index','no progress for 22 min','<span class="kb">⌘4</span>','warn')+
sec('Seen',5,0,'PR merged 2 · <span class="kb">⇧E</span> settle')+
sec('Snoozed',3,0,'next: tomorrow 06:00')+sec('Settled',11,0,'last 24 h')+'</div>';
var thread='<div class="th"><div class="thh"><div class="tr"><span class="tt">Fix map lasso on mobile</span><span class="bd sa">'+I.a+'Asking</span><span class="ml"><span class="hc">sonnet 5.5 · main</span>'+hc('desk')+'<button class="btn g">Snooze <span class="kb">s</span></button><button class="btn" disabled title="A question is open">Settle <span class="kb">e</span></button></span></div>'+
'<div class="tabs"><span class="on">Conversation</span><span>Changes<em>+42 −18</em></span><span>PR<em>#4182 · checks ✓</em></span></div></div>'+
'<div class="bdy"><div class="msg"><div class="who">Claude</div>The lasso now closes the filter sheet on small screens. Before I wire the gesture, two choices for you.</div>'+
'<div class="run"><div class="rh"><span class="bd sm">'+I.c+'</span> Run finished · 3 min</div>'+
'<div class="tl"><span class="sc">✓</span><span>pnpm vitest run src/map/lasso</span><span class="x">38 s</span></div>'+
'<div class="tl"><span class="sc">✓</span><span class="s">3 subagents · explored gesture handling in 14 files ▸</span><span class="x"></span></div>'+
'<div class="tl"><span class="sc">✓</span><span>edit src/map/FilterSheet.tsx  +42 −18</span><span class="x">diff ▸</span></div>'+
'<div class="film"><div class="shot"></div><div class="shot"></div><div class="shot"></div></div></div></div>'+
'<div class="dec"><div class="dh"><span class="bd sa">'+I.a+'</span><b>Question 1 of 2</b> · asked by subagent “explore gestures” · no default</div>'+
'<div class="db"><div class="q">Which gesture should close the filter sheet?</div>'+
'<div class="op on"><span class="kb">1</span><span><div class="a">Swipe down</div><div class="d">Matches the iOS sheet the app already uses.</div></span></div>'+
'<div class="op"><span class="kb">2</span><span><div class="a">Tap outside</div><div class="d">Simpler; conflicts with the lasso on small screens.</div></span></div>'+
'<div class="op"><span class="kb">3</span><span><div class="a">Both</div><div class="d">Most forgiving; two code paths to test.</div></span></div>'+
'<div class="op"><span class="kb">0</span><span><div class="a">Other…</div></span></div></div>'+
'<div class="q2"><span class="kb">Tab</span> Question 2: Which screens get the new sheet? <span class="ml">multi-select</span></div></div>'+
'<div class="cmp"><div class="in">Answer question 1 with your own words…</div><div class="cb"><span>Enter answers · <span class="kb">n</span> next item needing you</span><span class="ml"><button class="btn p">Answer <span class="kb">⏎</span></button></span></div></div></div>';
var phoneQ='<div class="ph"><div class="pt">‹ Inbox<span class="ml"><span class="bd sa">'+I.a+'Asking</span></span></div>'+
'<div class="pbody"><div style="font:400 12px/16px inherit;color:var(--im)">Fix map lasso on mobile · question 1 of 2</div>'+
'<div class="q">Which gesture should close the filter sheet?</div>'+
'<div class="tile on"><span class="kb">1</span><span><div style="font:500 15px/20px inherit">Swipe down</div><div style="font:400 12px/16px inherit;color:var(--im)">Matches the iOS sheet</div></span></div>'+
'<div class="tile"><span class="kb">2</span><span style="font:500 15px/20px inherit">Tap outside</span></div>'+
'<div class="tile"><span class="kb">3</span><span style="font:500 15px/20px inherit">Both</span></div>'+
'<div class="tile"><span class="kb">0</span><span style="font:500 15px/20px inherit">Other…</span></div></div>'+
'<div class="stick"><button class="btn g big">Snooze</button><button class="btn p big">Next question</button></div></div>';
var phoneN='<div class="ph"><div class="pt">New thread</div>'+
'<div class="pbody"><div class="paste">Tap to paste screenshot</div>'+
'<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip">acme/web ▾</span><span class="chip">sonnet 5.5 ▾</span><span class="chip">desk</span></div>'+
'<div class="ta">The filter chips overlap the map on iPhone mini. Fix it.</div></div>'+
'<div class="stick"><button class="btn g big">Photos</button><button class="btn p big">Start</button></div>'+
'<div class="pnav"><span>Inbox</span><span class="new">+</span><span>Search</span></div></div>';
var bulk='<div class="dk" style="grid-template-columns:1fr;position:relative;height:330px" data-theme="dark"><div class="ib" style="border:0">'+
'<div class="bar"><span class="br">Fyr</span><span class="hc">2 selected</span><span class="ml"><button class="btn">Settle <span class="kb">⇧E</span></button><button class="btn g">Snooze <span class="kb">s</span></button></span></div>'+
sec('Seen',5,0,'')+
'<div class="one"><span class="ck on"></span><div class="t">Lasso polygon perf<span>PR merged · 14:20</span></div><span class="pr mg">#4160 merged</span></div>'+
'<div class="one"><span class="ck on"></span><div class="t">Card grid spacing<span>PR merged · 14:31</span></div><span class="pr mg">#4171 merged</span></div>'+
'<div class="one"><span class="ck"></span><div class="t">Nix flake update<span>seen 13:05</span></div><span></span></div>'+
'<div class="one"><span class="ck"></span><div class="t">Recipe scaler<span>seen yesterday</span></div><span></span></div>'+
'</div><div class="toast">Settled 2 threads<button class="btn">Undo <span class="kb">⌘Z</span></button></div></div>';
document.getElementById('st').innerHTML=
'<div class="cap">1 · Desktop: inbox after a break, and a question docked above the composer</div><div class="fr"><div class="dk" data-theme="light">'+inbox+thread+'</div></div>'+
'<div class="cap">2 · Phone: answering from a push · starting a thread from a screenshot</div><div class="phones"><div data-theme="dark">'+phoneQ+'</div><div data-theme="dark">'+phoneN+'</div></div>'+
'<div class="cap">3 · Clearing merged work in bulk, with undo</div><div class="fr">'+bulk+'</div>';
</script></body></html>
