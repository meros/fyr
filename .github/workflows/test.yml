# Main's gate and release, on the self-hosted runner on meros-server (V0.ci-self-hosted): every push to main runs the
# whole gate on its head (secret scan, `make test` with the layout timing budgets, the Nix package) and, when it is
# green, publishes the release. Self-hosted minutes are free, so there is no hourly batch any more (#405 had one to
# save paid minutes). Runs queue on the one runner; a newer push replaces a run still waiting, so the newest main is
# what gets tested and released. A PR's gate is pr.yml on the same runner. Start a run by hand with
# `gh workflow run test.yml`.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-main
  cancel-in-progress: false # a waiting run is replaced by a newer push; a running one finishes (it may be releasing)

jobs:
  main:
    runs-on: [self-hosted, meros-server]
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # Go public (#196): no secret enters the history; .gitleaks.toml allows only the test placeholders.
      - name: gitleaks over the full history
        run: nix shell --inputs-from . nixpkgs#gitleaks -c gitleaks git --config .gitleaks.toml --redact --log-opts=--all .
      # make test's parts, with the layout timing budgets on. FYR_CHROME and FYR_LAYOUT_TIMING go to the web tests
      # only: a Go test (internal/authtest, neutrality) fails when the environment carries any FYR_ variable, and
      # make exports a command-line variable.
      - name: go vet, go test, typecheck, web unit, layout with timing, auth e2e
        run: |
          nix develop --command bash -c 'make web-deps && (cd web && npm run build) && make -j2 --output-sync=target go-vet go-test && FYR_CHROME=google-chrome make -j3 --output-sync=target web-typecheck web-unit web-layout FYR_LAYOUT_TIMING=1 && FYR_CHROME=google-chrome make web-auth'
      # The package NixOS installs runs the Go tests in the Nix sandbox (found live: a test needed git there).
      - name: nix build .#fyr
        run: nix build .#fyr --no-link --print-build-logs
      # #158: a green main publishes signed fyr and fyrd binaries as the release build-<sha12> and moves the tag
      # `deployable` forward to it. Hosts auto-update only to that.
      - name: build, sign and publish
        env:
          FYR_RELEASE_KEY: ${{ secrets.FYR_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_SHA=$(git rev-parse HEAD)
          export GITHUB_SHA
          git config user.name "fyr release"
          git config user.email "fyr-release@users.noreply.github.com"
          nix develop --command scripts/release.sh
