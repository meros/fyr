# The same gate as a local `make test` (docs/PROCESS.md): Go vet and tests, the web
# typecheck and tests, the build, and the layout e2e in headless Chrome. The toolchain
# comes from the flake's dev shell; Chrome is the runner's own google-chrome.
name: test

on:
  push:
    branches: [main, v0]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: make test
        env:
          FYR_CHROME: /usr/bin/google-chrome
        run: nix develop --command make test
