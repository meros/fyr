# Actions minutes on a private repo cost money, so this workflow is batched: once an hour, if main moved since the
# last run, one job runs the whole gate on main's head (secret scan, `make test`, the Nix package) and, when it is
# green, publishes the release. A PR starts no run here: its gate is scripts/ci-local.sh on the host, which posts
# the status `local/test` that Fyr waits for (docs/PROCESS.md). A break between batches shows up on the next one.
# Start a run by hand with `gh workflow run test.yml` (it always runs).
name: test

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-main
  cancel-in-progress: false

jobs:
  # One job, not four: each job pays for its own runner, Nix install and cache restore, and bills its minutes
  # rounded up.
  main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # A scheduled run on a head that a run of this workflow already finished (green or red) does nothing.
      - name: skip a head already tested
        id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$sha&status=completed&per_page=1" --jq .total_count)
          if [ "$n" -gt 0 ]; then echo "main ($sha) was tested already"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.skip.outputs.skip != '1'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - if: steps.skip.outputs.skip != '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            web/node_modules
          key: ci-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json', 'flake.lock') }}
      # Go public (#196): no secret enters the history; .gitleaks.toml allows only the test placeholders.
      - name: gitleaks over the full history
        if: steps.skip.outputs.skip != '1'
        run: nix shell --inputs-from . nixpkgs#gitleaks -c gitleaks git --config .gitleaks.toml --redact --log-opts=--all .
      # make test's parts, with the layout timing budgets on. FYR_LAYOUT_TIMING goes to the layout test's make only:
      # make exports a command-line variable, and a Go test checks that the environment does not carry it.
      - name: go vet, go test, typecheck, web unit, layout with timing, auth e2e
        if: steps.skip.outputs.skip != '1'
        env:
          FYR_CHROME: /usr/bin/google-chrome
        run: |
          nix develop --command bash -c 'make web-deps && (cd web && npm run build) && make -j2 --output-sync=target go-vet go-test && make -j3 --output-sync=target web-typecheck web-unit web-layout FYR_LAYOUT_TIMING=1 && make web-auth'
      # The package NixOS installs runs the Go tests in the Nix sandbox (found live: a test needed git there).
      - name: nix build .#fyr
        if: steps.skip.outputs.skip != '1'
        run: nix build .#fyr --no-link --print-build-logs
      # #158: a green main publishes signed fyr and fyrd binaries as the release build-<sha12> and moves the tag
      # `deployable` forward to it. Hosts auto-update only to that.
      - name: build, sign and publish
        if: steps.skip.outputs.skip != '1'
        env:
          FYR_RELEASE_KEY: ${{ secrets.FYR_RELEASE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_SHA=$(git rev-parse HEAD)
          git config user.name "fyr release"
          git config user.email "fyr-release@users.noreply.github.com"
          nix develop --command scripts/release.sh
