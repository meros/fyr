# A PR's gate, on the self-hosted runner on meros-server (V0.ci-self-hosted): self-hosted minutes cost nothing on a
# private repo, so PRs run on GitHub again (#405 had moved them to scripts/ci-local.sh to save paid minutes). The
# runner takes one job at a time; a newer push to a PR cancels its older run. scripts/ci-local.sh stays the fallback
# when the runner is down (its status local/test counts the same for Fyr).
#
# A self-hosted runner runs whatever a workflow says, and a PR runs the workflow from its own head, so a fork could
# edit this file. The lock is the repository's Actions setting "Require approval for all external contributors": no
# fork PR runs until the owner approves it, and the owner approves none on this runner (V0.public-repo). The `if`
# below makes an approved fork run skip the job instead of running it here.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, meros-server]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # make test as scripts/ci-local.sh runs it; Chromium is on PATH as google-chrome (the runner's NixOS module),
      # so no FYR_ variable reaches the Go tests (the neutrality test forbids them).
      - name: make test
        run: nix develop --command make test
      - name: gitleaks over the PR's commits
        run: nix shell --inputs-from . nixpkgs#gitleaks -c gitleaks git --config .gitleaks.toml --redact --log-opts="origin/${{ github.base_ref }}..HEAD" .
